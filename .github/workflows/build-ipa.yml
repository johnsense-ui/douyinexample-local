name: build-ipa

# DouyinExample_Player：objectVersion 77，需要 Xcode 16+
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          fi
          xcodebuild -version

      - name: Pods 自检
        run: |
          ls "Pods/Target Support Files" | head
          test -f "Pods/Target Support Files/Pods-DouyinVideoExample/Pods-DouyinVideoExample.release.xcconfig" \
            && echo "Pods xcconfig OK" || echo "缺 xcconfig"

      - name: 列出 scheme
        run: xcodebuild -list -workspace DouyinVideoExample.xcworkspace || true

      - name: 编译（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -workspace DouyinVideoExample.xcworkspace \
            -scheme DouyinVideoExample \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            OBJROOT="$PWD/build/obj" SYMROOT="$PWD/build/sym" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -z "$APP" ] && { echo "::error::没有 .app"; tail -80 build.log; exit 1; }
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          [ -f "$APP/$EXE" ] || { echo "::error::app 里没有可执行文件"; tail -80 build.log; exit 1; }
          echo "APP=$APP"

      - name: 失败保日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 打 ipa
        run: |
          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          cd out && zip -qry DouyinExample-unsigned.ipa Payload && ls -lh DouyinExample-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DouyinExample-unsigned-ipa
          path: out/DouyinExample-unsigned.ipa
